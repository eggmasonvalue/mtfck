name: Daily Database Update

on:
  schedule:
    # 06:00 IST is 00:30 UTC
    - cron: '30 0 * * *'
  workflow_dispatch:

jobs:
  update-db:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up uv
      uses: astral-sh/setup-uv@v5
      with:
        python-version: '3.12'
        enable-cache: true

    - name: Install dependencies
      run: uv sync

    - name: Run Database Update
      run: |
        export PYTHONPATH=$PYTHONPATH:$(pwd)/src
        uv run python -c "from mtfck.ingestion import update_to_today; update_to_today()"

    - name: Commit and Push changes
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'
        git add db/stock_data.db
        # Only commit if there are changes
        if git diff --staged --quiet; then
          echo "No changes to commit"
        else
          git commit -m "Automated DB Update: $(date +'%Y-%m-%d')"
          git push
        fi
