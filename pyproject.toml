[project]
name = "mtfck"
version = "0.3.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.10.8",
    "nse[server]>=2.0.0",
    "pandas>=2.3.3",
    "plotly>=6.5.2",
    "requests>=2.32.5",
    "streamlit>=1.53.1",
    "duckdb>=1.2.0",
    "tenacity>=9.1.3",
]

[project.scripts]
mtfck = "mtfck.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mtfck"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
    "ruff>=0.14.14",
    "playwright>=1.40.0",
    "pytest-playwright>=0.4.0",
]
